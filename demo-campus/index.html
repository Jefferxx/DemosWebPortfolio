<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campus — Coffee &amp; Beer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:hsl(43,100%,50%);--amber:hsl(36,100%,48%);
  --navy:hsl(227,66%,7%);--surface:hsl(227,45%,12%);
  --cream:#F8F4ED;--white:#fff;
  --txt-sec:hsl(215,20%,65%);--border:hsl(227,30%,18%);
  --success:hsl(142,72%,29%);--danger:hsl(0,72%,51%);
  --glow:0 0 22px hsla(43,100%,50%,.35);
  --r-sm:4px;--r-md:8px;--r-lg:16px;--r-full:9999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--navy);color:#fff;overflow-x:hidden}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s ease}
.reveal.revealed{opacity:1;transform:none}
.eyebrow{font-family:'Pacifico',cursive;color:var(--amber);font-size:1.2rem;margin-bottom:12px;display:block}
</style>
</head>
