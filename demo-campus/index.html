<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campus — Coffee &amp; Beer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:hsl(43,100%,50%);--amber:hsl(36,100%,48%);
  --navy:hsl(227,66%,7%);--surface:hsl(227,45%,12%);
  --cream:#F8F4ED;--white:#fff;
  --txt-sec:hsl(215,20%,65%);--border:hsl(227,30%,18%);
  --success:hsl(142,72%,29%);--danger:hsl(0,72%,51%);
  --glow:0 0 22px hsla(43,100%,50%,.35);
  --r-sm:4px;--r-md:8px;--r-lg:16px;--r-full:9999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--navy);color:#fff;overflow-x:hidden}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s ease}
.reveal.revealed{opacity:1;transform:none}
.eyebrow{font-family:'Pacifico',cursive;color:var(--amber);font-size:1.2rem;margin-bottom:12px;display:block}
/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--navy);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:72px;transition:box-shadow .3s}
nav.scrolled{box-shadow:0 4px 24px rgba(0,0,0,.7)}
.nav-logo img{height:46px;width:auto}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{color:var(--txt-sec);text-decoration:none;font-size:.82rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.nav-cta{background:var(--gold);color:var(--navy);border:none;padding:10px 20px;border-radius:var(--r-full);font-family:'Outfit',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:7px;transition:background .2s,box-shadow .2s,transform .1s;white-space:nowrap}
.nav-cta:hover{background:var(--amber);box-shadow:var(--glow)}
.nav-cta:active{transform:scale(.97)}
@media(max-width:1024px){nav{padding:0 24px}.nav-links{display:none}}
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a href="#inicio" class="nav-logo"><img src="KitDiseno/logo_campus.png" alt="Campus Coffee &amp; Beer"></a>
  <ul class="nav-links">
    <li><a href="#inicio">Inicio</a></li>
    <li><a href="#menu">Menu</a></li>
    <li><a href="#horarios">Horarios</a></li>
    <li><a href="#contacto">Contacto</a></li>
  </ul>
  <a href="https://wa.me/593XXXXXXXXX?text=Hola%20Campus!" class="nav-cta" target="_blank">
    Pedir por WhatsApp
  </a>
</nav>

</body>
</html>
