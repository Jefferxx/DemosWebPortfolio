<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campus — Coffee &amp; Beer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:hsl(43,100%,50%);--amber:hsl(36,100%,48%);
  --navy:hsl(227,66%,7%);--surface:hsl(227,45%,12%);
  --cream:#F8F4ED;--white:#fff;
  --txt-sec:hsl(215,20%,65%);--border:hsl(227,30%,18%);
  --success:hsl(142,72%,29%);--danger:hsl(0,72%,51%);
  --glow:0 0 22px hsla(43,100%,50%,.35);
  --r-sm:4px;--r-md:8px;--r-lg:16px;--r-full:9999px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--navy);color:#fff;overflow-x:hidden}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s ease}
.reveal.revealed{opacity:1;transform:none}
.eyebrow{font-family:'Pacifico',cursive;color:var(--amber);font-size:1.2rem;margin-bottom:12px;display:block}
/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--navy);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:72px;transition:box-shadow .3s}
nav.scrolled{box-shadow:0 4px 24px rgba(0,0,0,.7)}
.nav-logo img{height:46px;width:auto}
.nav-links{display:flex;gap:32px;list-style:none}
.nav-links a{color:var(--txt-sec);text-decoration:none;font-size:.82rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:var(--gold)}
.nav-cta{background:var(--gold);color:var(--navy);border:none;padding:10px 20px;border-radius:var(--r-full);font-family:'Outfit',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:7px;transition:background .2s,box-shadow .2s,transform .1s;white-space:nowrap}
.nav-cta:hover{background:var(--amber);box-shadow:var(--glow)}
.nav-cta:active{transform:scale(.97)}
/* HERO */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;background:var(--navy);overflow:hidden;padding-top:72px}
.hero-img{position:absolute;right:0;top:0;width:58%;height:100%;object-fit:cover;object-position:center;filter:brightness(.8)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 44%,rgba(6,11,30,.55) 72%,transparent 100%)}
.hero-content{position:relative;z-index:2;padding:0 80px;max-width:680px;display:flex;flex-direction:column;gap:0}
.hero-eyebrow{font-family:'Pacifico',cursive;color:var(--gold);font-size:1.65rem;margin-bottom:4px;opacity:0;animation:up .6s ease .2s forwards}
.hero-h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(4.5rem,10vw,9.5rem);line-height:.88;letter-spacing:.02em;margin-bottom:28px;opacity:0;animation:up .7s ease .4s forwards}
.hero-h1 span{color:var(--gold)}
.hero-note{font-family:'Pacifico',cursive;color:var(--gold);font-size:1.1rem;margin-bottom:20px;opacity:0;animation:up .5s ease .55s forwards}
.hero-sub{color:var(--txt-sec);font-size:1rem;line-height:1.7;max-width:400px;margin-bottom:32px;opacity:0;animation:up .7s ease .6s forwards}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap;opacity:0;animation:up .7s ease .8s forwards}
.btn-gold{background:var(--gold);color:var(--navy);border:none;padding:13px 30px;border-radius:var(--r-full);font-family:'Outfit',sans-serif;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:background .2s,box-shadow .2s,transform .1s}
.btn-gold:hover{background:var(--amber);box-shadow:var(--glow)}
.btn-gold:active{transform:scale(.97)}
.btn-ghost{color:#fff;border:1.5px solid rgba(255,255,255,.28);padding:13px 30px;border-radius:var(--r-full);font-family:'Outfit',sans-serif;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;background:transparent;transition:border-color .2s,background .2s}
.btn-ghost:hover{border-color:var(--gold);background:rgba(255,184,0,.08)}
@media(max-width:1024px){nav{padding:0 24px}.nav-links{display:none}.hero-content{padding:0 40px}}
@media(max-width:768px){.hero-img{opacity:.3;width:100%}.hero-grad{background:linear-gradient(to bottom,transparent 10%,var(--navy) 60%)}.hero-content{padding:0 24px;max-width:100%}}
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a href="#inicio" class="nav-logo"><img src="KitDiseno/logo_campus.png" alt="Campus Coffee &amp; Beer"></a>
  <ul class="nav-links">
    <li><a href="#inicio">Inicio</a></li>
    <li><a href="#menu">Menu</a></li>
    <li><a href="#horarios">Horarios</a></li>
    <li><a href="#contacto">Contacto</a></li>
  </ul>
  <a href="https://wa.me/593XXXXXXXXX?text=Hola%20Campus!" class="nav-cta" target="_blank">
    Pedir por WhatsApp
  </a>
</nav>

<!-- HERO -->
<section class="hero" id="inicio">
  <img src="KitDiseno/portada_menu_comida.jpg" alt="" class="hero-img" aria-hidden="true">
  <div class="hero-grad"></div>
  <div class="hero-content">
    <p class="hero-eyebrow">Damn Good</p>
    <h1 class="hero-h1">CAMPUS<br><span>COFFEE<br>&amp; BEER</span></h1>
    <p class="hero-note">El mejor cafe y la mejor cerveza de la ciudad</p>
    <p class="hero-sub">Desde el primer cafe de la manana hasta la ultima cerveza de la noche — Campus es tu lugar todos los dias.</p>
    <div class="hero-btns">
      <a href="#menu" class="btn-gold">Ver el Menu</a>
      <a href="#contacto" class="btn-ghost">Encuentranos</a>
    </div>
  </div>
</section>

</body>
</html>
